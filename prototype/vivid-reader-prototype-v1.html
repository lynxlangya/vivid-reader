<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>历历 · Vivid — 首版高保真界面原型</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   TOKENS — 所有颜色只在此处与 .night 覆盖块中出现，正文一律 var()
   ═══════════════════════════════════════════════════════════════════ */
:root{
  /* 纸 · 日间 */
  --paper:#F6F3EC; --silk:#FBFAF6; --sand:#EFEBE2;
  --border:#E2DCCD; --border-soft:#EAE5D8;
  --ink:#1F1D1A; --ink-soft:#4A4640; --smoke:#6B675F; --faint:#9A958B;
  --accent:#2E6B78; --accent-tint:#E2E9E7; --accent-deep:#255863;
  /* 实体五色 · 线/字 与 标签底 */
  --c-place:#2E6B78;  --t-place:#E2E9E7;
  --c-person:#8F5530; --t-person:#EEE6DE;
  --c-people:#7D5F12; --t-people:#ECE7DB;
  --c-species:#476E32;--t-species:#E5E9DE;
  --c-concept:#9B3A4A;--t-concept:#EFE3E1;
  /* 地图 */
  --map-land:#EFEAE0; --map-water:#D9E2E1; --map-border:#CFC6B4; --map-coast:#C9C0AE; --map-label:#6B675F; --map-dot:#9A958B;
  /* 窗口外舞台（原型外壳，非产品 UI） */
  --shell:#E9E4D8; --shell-ink:#4A4640; --shell-line:#D8D1C1;
  /* macOS 系统红绿灯（系统色，非应用调色板） */
  --tl-red:#FF5F57; --tl-yellow:#FEBC2E; --tl-green:#28C840;
  /* 阴影 */
  --sh-2:0 8px 28px rgba(31,29,26,.12), 0 0 0 1px rgba(31,29,26,.06);
  --sh-3:0 16px 48px rgba(31,29,26,.16), 0 0 0 1px rgba(31,29,26,.06);
  --sh-win:0 24px 70px rgba(31,29,26,.20), 0 0 0 1px rgba(31,29,26,.08);
  /* 字体 */
  --font-reading:"Source Han Serif SC","Noto Serif SC","Songti SC","STSong",serif;
  --font-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  --font-mono:"SF Mono",ui-monospace,Menlo,monospace;
  /* 动效 */
  --ease:cubic-bezier(.23,1,.32,1);
}
.night{
  --paper:#1A1916; --silk:#24221E; --sand:#2C2A25;
  --border:#3A3731; --border-soft:#33302A;
  --ink:#E8E3D8; --ink-soft:#B8B1A4; --smoke:#9A9488; --faint:#6E685D;
  --accent:#7FB4BD; --accent-tint:#2A3639; --accent-deep:#9EC6CD;
  --c-place:#7FB4BD;  --t-place:#333937;
  --c-person:#D49C77; --t-person:#40362C;
  --c-people:#D2B260; --t-people:#403929;
  --c-species:#99BD85;--t-species:#373B2E;
  --c-concept:#DB8C97;--t-concept:#413331;
  --map-land:#26241F; --map-water:#1C2224; --map-border:#45413A; --map-coast:#3E3A34; --map-label:#B8B1A4; --map-dot:#8F897D;
  --sh-2:0 8px 28px rgba(0,0,0,.4); --sh-3:0 16px 48px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--shell); color:var(--shell-ink);
  font-family:var(--font-ui); font-size:13px; line-height:1.45;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button{font:inherit;cursor:pointer;background:none;border:0;color:inherit}
svg{display:block}

/* ═══ 原型外壳：画面切换条（设计者导航，不属于产品 UI） ═══ */
.shellbar{
  position:sticky; top:0; z-index:60;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:11px 22px; background:var(--shell);
  border-bottom:1px solid var(--shell-line);
}
.shellbar .brand{font-family:var(--font-reading);font-weight:600;font-size:15px;color:var(--shell-ink);white-space:nowrap}
.shellbar .brand em{font-style:normal;font-family:var(--font-mono);font-size:11px;color:#8A8473;margin-left:8px;letter-spacing:.04em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  font-family:var(--font-ui);font-size:12px;color:var(--shell-ink);
  padding:5px 11px;border-radius:999px;border:1px solid var(--shell-line);
  background:color-mix(in oklab,var(--silk) 55%,transparent); white-space:nowrap;
  transition:background .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease);
}
.chip .n{font-family:var(--font-mono);font-size:10px;opacity:.55;margin-right:5px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--silk)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.viewport{width:100%;display:flex;justify-content:center;padding:26px 0 60px}
.stage{width:1440px;height:900px;position:relative;transform-origin:top center}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:block}

/* ═══ macOS 窗口 ═══ */
.macwin{
  width:1440px;height:900px;background:var(--paper);border-radius:12px;overflow:hidden;
  box-shadow:var(--sh-win);display:flex;flex-direction:column;position:relative;color:var(--ink);
}
.titlebar{
  height:44px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:0 16px;border-bottom:1px solid var(--border);
  background:color-mix(in oklab,var(--paper) 88%,var(--sand));
}
.night .titlebar{background:color-mix(in oklab,var(--paper) 90%,var(--sand))}
.lights{display:flex;gap:8px;align-items:center;padding-left:4px}
.light{width:12px;height:12px;border-radius:50%}
.light.r{background:var(--tl-red)}.light.y{background:var(--tl-yellow)}.light.g{background:var(--tl-green)}
.tb-title{
  font-family:var(--font-ui);font-size:13px;color:var(--smoke);white-space:nowrap;
  max-width:640px;overflow:hidden;text-overflow:ellipsis;
}
.tb-title b{color:var(--ink);font-weight:500}
.tb-actions{display:flex;gap:4px;justify-content:flex-end}
.icb{
  width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--smoke);
  transition:background .15s var(--ease),color .15s var(--ease);
}
.icb:hover{background:var(--sand);color:var(--ink)}
.icb.on{color:var(--accent);background:var(--accent-tint)}
.icb:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.icb svg{width:17px;height:17px}

.winbody{flex:1;display:flex;min-height:0;position:relative}
.scroll{overflow:hidden;flex:1;min-width:0;position:relative}
.reader{max-width:720px;margin:0 auto;padding:66px 0 90px}
.ch-no{
  font-family:var(--font-ui);font-size:13px;font-weight:500;letter-spacing:.2em;
  color:var(--smoke);margin:0 0 14px;
}
.ch-title{
  font-family:var(--font-reading);font-size:30px;line-height:1.4;font-weight:600;
  color:var(--ink);margin:0 0 30px;letter-spacing:.01em;
}
.para{
  font-family:var(--font-reading);font-size:19px;line-height:1.85;color:var(--ink);
  margin:0 0 .6em;text-indent:2em;text-align:justify;text-justify:inter-ideograph;
}
.para:last-child{margin-bottom:0}

/* 实体标注 */
.ent{--ec:var(--c-place);--tt:var(--t-place);
  text-decoration:underline dotted;text-decoration-thickness:1.5px;
  text-underline-offset:4px;text-decoration-color:var(--ec);
  padding:0 2px;margin:0 -2px;border-radius:3px;transition:background .14s var(--ease);
}
.ent.place{--ec:var(--c-place);--tt:var(--t-place)}
.ent.person{--ec:var(--c-person);--tt:var(--t-person)}
.ent.people{--ec:var(--c-people);--tt:var(--t-people)}
.ent.species{--ec:var(--c-species);--tt:var(--t-species)}
.ent.concept{--ec:var(--c-concept);--tt:var(--t-concept)}
.ent.seen{text-decoration-color:color-mix(in srgb,var(--ec) 60%,var(--paper))}
.ent:hover,.ent.is-hover{text-decoration-style:solid;background:var(--tt)}
.sel{background:color-mix(in oklab,var(--accent) 20%,transparent);border-radius:2px}

/* 进度条 */
.progress{height:2px;flex:none;background:var(--border-soft);position:relative}
.progress > i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:0 2px 2px 0}
.progress .btick{position:absolute;top:-3px;width:2px;height:8px;background:var(--faint);border-radius:1px}

/* ═══ 通用控件 ═══ */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;font-family:var(--font-ui);font-size:13px;height:32px;padding:0 14px;border:1px solid transparent;transition:background .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);color:var(--silk)}
.btn-primary:hover{background:var(--accent-deep)}
.btn-secondary{background:var(--sand);color:var(--ink);border-color:var(--border)}
.btn-secondary:hover{border-color:var(--smoke)}
.btn-text{color:var(--smoke);padding:0 6px;height:28px;border-radius:6px}
.btn-text:hover{color:var(--accent)}
.tbtn{height:26px;padding:0 10px;border-radius:6px;font-size:12px;color:var(--smoke);border:1px solid var(--border);background:var(--silk)}
.tbtn:hover{color:var(--accent);border-color:var(--accent)}
.tbtn.hot{color:var(--accent);border-color:var(--accent);background:var(--accent-tint)}

.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:6px;font-family:var(--font-ui);font-size:12px;font-weight:500}
.tag.place{color:var(--c-place);background:var(--t-place)}
.tag.person{color:var(--c-person);background:var(--t-person)}
.tag.people{color:var(--c-people);background:var(--t-people)}
.tag.species{color:var(--c-species);background:var(--t-species)}
.tag.concept{color:var(--c-concept);background:var(--t-concept)}

/* ═══ 悬停卡片 Glimpse ═══ */
.glimpse{
  position:absolute;width:380px;max-height:520px;background:var(--silk);
  border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh-2);
  padding:14px;display:flex;flex-direction:column;gap:12px;z-index:30;
  animation:gp .2s var(--ease) both;
}
@keyframes gp{from{opacity:0;transform:translateY(4px) scale(.98)}to{opacity:1;transform:none}}
.glimpse .map{width:100%;border-radius:8px;overflow:hidden;position:relative;background:var(--map-water)}
.glimpse .map svg{width:100%;height:auto;display:block}
.map .land{fill:var(--map-land)}
.map .bd{fill:none;stroke:var(--map-border);stroke-width:.8;stroke-dasharray:3 2.5}
.map .coast{fill:none;stroke:var(--map-coast);stroke-width:.6}
.map .halo{fill:var(--accent);opacity:.18}
.map .dot{fill:var(--accent);stroke:var(--paper);stroke-width:3}
.map .prev{fill:var(--map-dot)}
.map .mlabel{font-family:var(--font-ui);font-size:11px;fill:var(--map-label)}
.map-cap{position:absolute;left:0;right:0;bottom:0;padding:5px 9px;font-family:var(--font-mono);font-size:10px;letter-spacing:.03em;color:var(--smoke);background:color-mix(in oklab,var(--silk) 82%,transparent)}

.gp-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.gp-name{font-family:var(--font-reading);font-size:20px;line-height:1.35;font-weight:600;color:var(--ink)}
.gp-orig{font-family:var(--font-ui);font-size:13px;color:var(--smoke)}
.gp-head .tag{margin-left:auto;align-self:center}
.gp-fact{font-family:var(--font-ui);font-size:13px;color:var(--smoke);line-height:1.5;margin-top:-4px}
.gp-fact .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.rule{border:0;border-top:1px solid var(--border-soft);margin:0}
.gp-sec{display:flex;gap:10px}
.gp-sec .bar{flex:none;width:2px;border-radius:2px;background:var(--ec,var(--c-place))}
.gp-sec .body{min-width:0}
.gp-sec h4{font-family:var(--font-ui);font-size:12px;font-weight:500;color:var(--smoke);margin:0 0 5px}
.gp-sec p{font-family:var(--font-ui);font-size:14px;line-height:1.65;color:var(--ink-soft);margin:0}
.gp-foot{display:flex;align-items:center}
.gp-foot .seen{font-family:var(--font-ui);font-size:12px;color:var(--smoke)}
.gp-actions{display:flex;gap:10px;padding-top:2px}
.gp-actions .btn-text{color:var(--smoke);font-size:13px}
.gp-actions .btn-text:hover{color:var(--accent)}

/* 骨架条 */
.skel{height:11px;border-radius:5px;background:var(--border-soft);animation:bre 1.6s ease-in-out infinite}
.skel+.skel{margin-top:9px}
.skel.s1{width:100%}.skel.s2{width:96%}.skel.s3{width:62%}
@keyframes bre{0%,100%{opacity:.5}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .glimpse{animation:none}.skel{animation:none}
}

/* 画像占位 */
.portrait-ph{
  width:100%;aspect-ratio:4/3;border-radius:8px;background:var(--border-soft);
  border:1px solid var(--border);position:relative;display:grid;place-items:center;overflow:hidden;
}
.portrait-ph .ph-lab{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}
.prov{
  position:absolute;right:0;bottom:0;padding:2px 7px;font-family:var(--font-ui);font-size:11px;color:var(--smoke);
  background:color-mix(in oklab,var(--silk) 80%,transparent);border-top-left-radius:6px;
}

/* 状态提示（未能定位 / 出错） */
.state{display:flex;flex-direction:column;gap:10px;padding:2px 0}
.state .msg{font-family:var(--font-ui);font-size:14px;line-height:1.6;color:var(--ink-soft)}
.state .msg.dim{color:var(--smoke)}

/* ═══ 侧栏：目录 / 伴读 ═══ */
.toc{width:260px;flex:none;background:var(--sand);border-right:1px solid var(--border);padding:22px 14px;overflow:hidden}
.toc h3{font-family:var(--font-ui);font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--smoke);margin:6px 8px 14px;text-transform:uppercase}
.toc-row{display:flex;align-items:baseline;gap:8px;padding:8px 8px 8px 10px;border-radius:7px;font-family:var(--font-reading);font-size:15px;color:var(--smoke);position:relative}
.toc-row .pin{position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:2px;background:transparent}
.toc-row.done{color:var(--ink-soft)}
.toc-row.cur{color:var(--ink);font-weight:600}
.toc-row.cur .pin{background:var(--accent)}
.toc-row .pct{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--smoke);font-variant-numeric:tabular-nums}
.toc-row.locked{color:var(--faint)}

.companion{width:360px;flex:none;background:var(--sand);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.cp-head{padding:16px 18px 14px;border-bottom:1px solid var(--border)}
.cp-head .line1{display:flex;align-items:center;gap:8px}
.cp-head h3{font-family:var(--font-ui);font-size:14px;font-weight:600;color:var(--ink);margin:0}
.cp-head .lock{color:var(--smoke);display:inline-flex}
.cp-head .lock svg{width:14px;height:14px}
.cp-bound{display:flex;align-items:center;gap:6px;margin-top:7px;font-family:var(--font-ui);font-size:12px;color:var(--smoke)}
.cp-bound .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.cp-body{flex:1;overflow:hidden;padding:18px;display:flex;flex-direction:column;gap:18px}
.msg-r{align-self:flex-end;max-width:84%;background:var(--silk);border:1px solid var(--border);border-radius:10px 10px 3px 10px;padding:9px 12px;font-family:var(--font-ui);font-size:14px;line-height:1.6;color:var(--ink)}
.msg-a{max-width:92%;font-family:var(--font-ui);font-size:14px;line-height:1.7;color:var(--ink)}
.msg-a .ref{color:var(--accent);text-decoration:none}
.msg-a .ref:hover{text-decoration:underline}
.cp-foot{padding:14px 16px 16px;border-top:1px solid var(--border);background:color-mix(in oklab,var(--sand) 70%,var(--silk))}
.cp-quick{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.cp-input{display:flex;align-items:center;gap:8px;background:var(--silk);border:1px solid var(--border);border-radius:8px;padding:0 10px;height:38px}
.cp-input input{border:0;background:none;outline:0;font:inherit;font-family:var(--font-ui);font-size:13px;color:var(--ink);flex:1}
.cp-input .hint{font-family:var(--font-mono);font-size:11px;color:var(--faint)}

/* 选中工具条 */
.seltool{
  position:absolute;z-index:40;display:flex;align-items:center;gap:2px;padding:4px;
  background:var(--silk);border:1px solid var(--border);border-radius:9px;box-shadow:var(--sh-2);
}
.seltool button{font-family:var(--font-ui);font-size:12px;color:var(--smoke);padding:4px 10px;border-radius:6px}
.seltool button:hover{color:var(--accent);background:var(--accent-tint)}
.seltool .sep{width:1px;height:16px;background:var(--border);margin:0 2px}

/* ═══ 书架 ═══ */
.pagepad{padding:40px 56px 70px;overflow:hidden;height:100%}
.page-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:30px}
.page-h h2{font-family:var(--font-reading);font-size:26px;font-weight:600;color:var(--ink);margin:0}
.page-h .sub{font-family:var(--font-ui);font-size:12px;color:var(--smoke)}
.shelf{display:grid;grid-template-columns:repeat(6,1fr);gap:34px 30px}
.book{display:flex;flex-direction:column;gap:11px}
.cover-wrap{position:relative}
.cover{width:100%;aspect-ratio:2/3;border-radius:6px;border:1px solid var(--border);overflow:hidden;background:var(--sand)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.badge-pre{position:absolute;right:6px;bottom:6px;font-family:var(--font-mono);font-size:10px;color:var(--silk);background:color-mix(in oklab,var(--ink) 82%,transparent);padding:3px 6px;border-radius:5px;letter-spacing:.02em}
.book h4{font-family:var(--font-reading);font-size:15px;font-weight:600;color:var(--ink);margin:0;line-height:1.35}
.book .au{font-family:var(--font-ui);font-size:12px;color:var(--smoke)}
.book .bar{height:2px;border-radius:2px;background:var(--border-soft);position:relative;overflow:hidden}
.book .bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:2px}
.book.unread .bar{opacity:.5}
.book .bt{font-family:var(--font-mono);font-size:10px;color:var(--smoke);font-variant-numeric:tabular-nums}

/* ═══ 导入 ═══ */
.import-wrap{max-width:640px;margin:64px auto 0;padding:0 40px}
.import-wrap h2{font-family:var(--font-reading);font-size:26px;font-weight:600;color:var(--ink);margin:0 0 8px}
.import-wrap .lead{font-family:var(--font-ui);font-size:14px;line-height:1.65;color:var(--smoke);margin:0 0 34px;max-width:52ch}
.step{display:flex;gap:16px;padding:16px 0;border-top:1px solid var(--border-soft)}
.step:last-of-type{border-bottom:1px solid var(--border-soft)}
.step .dot{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;margin-top:1px}
.step.done .dot{background:var(--accent);border-color:var(--accent)}
.step.done .dot svg{stroke:var(--silk)}
.step.active .dot{border-color:var(--accent)}
.step.active .dot i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:block}
.step .body{flex:1;min-width:0}
.step .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.step h4{font-family:var(--font-ui);font-size:14px;font-weight:500;color:var(--ink);margin:0}
.step .st{font-family:var(--font-mono);font-size:11px;color:var(--smoke);font-variant-numeric:tabular-nums}
.step .track{height:3px;border-radius:3px;background:var(--border-soft);margin-top:10px;position:relative;overflow:hidden}
.step .track i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.step p{font-family:var(--font-ui);font-size:12px;color:var(--smoke);margin:8px 0 0}
.import-note{margin-top:30px;display:flex;gap:10px;align-items:flex-start;background:var(--silk);border:1px solid var(--border);border-radius:10px;padding:13px 15px}
.import-note svg{width:15px;height:15px;color:var(--smoke);flex:none;margin-top:1px}
.import-note p{font-family:var(--font-ui);font-size:13px;line-height:1.6;color:var(--ink-soft);margin:0}

/* ═══ 设置 ═══ */
.stage-center{width:1440px;height:900px;display:grid;place-items:center}
.prefwin{width:800px;height:640px;background:var(--paper);border-radius:12px;overflow:hidden;box-shadow:var(--sh-win);display:flex;flex-direction:column;color:var(--ink)}
.pref-body{flex:1;display:flex;min-height:0}
.pref-side{width:196px;flex:none;background:var(--sand);border-right:1px solid var(--border);padding:14px 10px;display:flex;flex-direction:column;gap:3px}
.pref-side button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;font-family:var(--font-ui);font-size:13px;color:var(--ink-soft);text-align:left}
.pref-side button svg{width:16px;height:16px;color:var(--smoke)}
.pref-side button:hover{background:color-mix(in oklab,var(--silk) 60%,transparent)}
.pref-side button[aria-pressed="true"]{background:var(--accent);color:var(--silk)}
.pref-side button[aria-pressed="true"] svg{color:var(--silk)}
.pref-side button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pref-main{flex:1;overflow:hidden;padding:26px 30px}
.pref-main h3{font-family:var(--font-ui);font-size:16px;font-weight:600;color:var(--ink);margin:0 0 20px}
.grp{background:var(--silk);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:18px}
.row{display:flex;align-items:center;gap:16px;padding:13px 16px;border-top:1px solid var(--border-soft)}
.row:first-child{border-top:0}
.row .lbl{font-family:var(--font-ui);font-size:13px;color:var(--ink);flex:none;width:96px}
.row .desc{font-family:var(--font-ui);font-size:12px;color:var(--smoke);margin-left:auto}
.seg{display:inline-flex;background:var(--sand);border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px}
.seg button{padding:5px 12px;border-radius:6px;font-family:var(--font-ui);font-size:12px;color:var(--smoke)}
.seg button[aria-pressed="true"]{background:var(--silk);color:var(--ink);box-shadow:0 1px 2px rgba(31,29,26,.08)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.stepper{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--silk)}
.stepper button{width:28px;height:28px;color:var(--smoke);display:grid;place-items:center}
.stepper button:hover{color:var(--ink);background:var(--sand)}
.stepper .val{font-family:var(--font-mono);font-size:12px;color:var(--ink);min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.switch{width:38px;height:22px;border-radius:999px;background:var(--border);position:relative;transition:background .18s var(--ease)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--silk);box-shadow:0 1px 2px rgba(31,29,26,.25);transition:transform .18s var(--ease)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
.cbx{width:18px;height:18px;border-radius:5px;border:1px solid var(--border);background:var(--silk);display:grid;place-items:center}
.cbx[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.cbx svg{width:11px;height:11px;stroke:var(--silk);opacity:0}
.cbx[aria-checked="true"] svg{opacity:1}
.dotc{width:9px;height:9px;border-radius:50%;flex:none}
.inp{flex:1;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--silk);padding:0 10px;font-family:var(--font-mono);font-size:12px;color:var(--ink);outline:0;letter-spacing:.06em}
.inp:focus-visible{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-tint)}
.inp[disabled]{background:var(--border-soft);color:var(--smoke);letter-spacing:normal;font-family:var(--font-ui)}
</style>
</head>

/* ── 地图渲染 ── */
function mapSA(marker){
  const paths = MAP_SA.map(d=>`<path class="land" d="${d}"/>`).join("");
  const borders = MAP_SA.map(d=>`<path class="bd" d="${d}"/>`).join("");
  const mk = marker ? `<circle class="halo" cx="112.7" cy="73.1" r="10"/>`+
    `<circle class="dot" cx="112.7" cy="73.1" r="5"/>` +
    `<text class="mlabel" x="124" y="70">卡哈马卡</text>` +
    `<circle class="prev" cx="88" cy="150" r="3.5"/><text class="mlabel" x="96" y="153" font-size="10">利马</text>`
    : "";
  return `<div class="map"><svg viewBox="0 0 380 190" role="img" aria-label="南美洲西岸地图，当前标记为秘鲁北部的卡哈马卡">`+
    `<rect width="380" height="190" fill="var(--map-water)"/>${paths}${borders}${mk}</svg></div>`;
}
function mapWorld(){
  const paths = MAP_WORLD.map(d=>`<path class="land" d="${d}"/>`).join("");
  return `<div class="map"><svg viewBox="0 0 380 190" role="img" aria-label="淡色世界地图">`+
    `<rect width="380" height="190" fill="var(--map-water)"/>${paths}</svg>`+
    `<span class="map-cap">地图 · 未能定位</span></div>`;
}

/* ── 实体标注 ── */
function ent(type,text,id,cls){ return `<span class="ent ${type} ${cls||''}" data-entity="${id||''}">${text}</span>`; }

/* ── 正文（自拟示意文字，非任何真实书籍原文） ── */
function readerHTML(){
  return `
    <p class="ch-no">第 3 章</p>
    <h1 class="ch-title">碰撞于卡哈马卡</h1>
    <p class="para">一五三二年十一月，安第斯山区北部的小城${ent("place","卡哈马卡","cajamarca")}，两支从未见过彼此的人群迎面相遇。一边是皮萨罗带领的不到两百名西班牙士兵，另一边是印加皇帝${ent("person","阿塔瓦尔帕","atahualpa")}和他身边数以万计的随从。在旧大陆与新大陆之间，横着整整一个${ent("place","大西洋","atlantic")}，也横着一万多年各自独立的历史。为什么是骑着${ent("species","马","horse")}的西班牙人来到了秘鲁，而不是印加人渡海去了西班牙？</p>
    <p class="para">为什么是欧洲人渡海而来，而不是美洲的居民扬帆西去？答案并不藏在谁的智慧或勇气里，而藏在两片大陆各自拥有的起点上。</p>
    <p class="para">有些土地很早就长出了适合耕种的作物，也很早地把野性未驯的动物变成了家畜。<span class="sel">可供驯化的物种越多，人口就越容易稠密，分工就越细</span>，手艺与知识也就越容易一代代攒下来。而这一切，最初都发端于一万三千年前的那片${ent("place","新月沃地","fertile")}。</p>
    <p class="para">久而久之，这些差别不再是细枝末节，而是先决定了谁先拥有文字、钢铁与远洋的船。</p>`;
}

/* ── 窗口骨架 ── */
function titlebar(title,opts){
  opts=opts||{};
  const ic=(d,on,label)=>`<button class="icb ${on?'on':''}" title="${label}" aria-label="${label}">${d}</button>`;
  const ico={
    toc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
    theme:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/></svg>',
    comp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M14 4v16"/></svg>'
  };
  return `<div class="titlebar" data-od-id="titlebar">
    <div class="lights"><span class="light r"></span><span class="light y"></span><span class="light g"></span></div>
    <div class="tb-title">${title}</div>
    <div class="tb-actions">${ic(ico.toc,opts.toc,'目录')}${ic(ico.theme,opts.theme,'主题')}${ic(ico.comp,opts.comp,'伴读')}</div>
  </div>`;
}
function progress(pct,boundary){
  const bt = boundary!=null?`<span class="btick" style="left:${boundary}%"></span>`:"";
  return `<div class="progress"><i style="width:${pct}%"></i>${bt}</div>`;
}
function macwin(inner,cls){ return `<div class="macwin ${cls||''}">${inner}</div>`; }
function readerPane(hoverId){
  let h=readerHTML();
  if(hoverId){ h=h.replace(new RegExp(`class="ent (\\w+) " data-entity="${hoverId}"`),`class="ent $1 is-hover" data-entity="${hoverId}"`); }
  return `<div class="scroll"><div class="reader">${h}</div></div>`;
}

/* ═══════════════ 渲染 / 切换 ═══════════════ */
const stage=document.getElementById('stage');
const chipsEl=document.getElementById('chips');
let scale=1;

SCREENS.forEach((s,i)=>{
  const sec=document.createElement('section');
  sec.className='screen'; sec.dataset.screen=s.id; sec.dataset.odId='screen-'+s.id;
  sec.innerHTML=s.render();
  stage.appendChild(sec);
  const c=document.createElement('button');
  c.className='chip'; c.innerHTML=`<span class="n">${String(i+1).padStart(2,'0')}</span>${s.label}`;
  c.addEventListener('click',()=>show(s.id));
  chipsEl.appendChild(c);
});

function show(id){
  const target=SCREENS.find(s=>s.id===id)||SCREENS[0];
  [...stage.children].forEach(sec=>sec.classList.toggle('active',sec.dataset.screen===target.id));
  [...chipsEl.children].forEach((c,i)=>c.setAttribute('aria-pressed',SCREENS[i].id===target.id));
  try{localStorage.setItem('vivid.screen',target.id)}catch(e){}
  requestAnimationFrame(()=>layoutScreen(target.id));
}

/* 悬停卡片 / 选中工具条的定位：绝不遮挡被悬停的那一行 */
function layoutScreen(id){
  const sec=stage.querySelector(`[data-screen="${id}"]`); if(!sec)return;
  const win=sec.querySelector('.macwin'); if(!win)return;
  const wr=win.getBoundingClientRect();
  const sx=v=> (v-wr.left)/scale, sy=v=> (v-wr.top)/scale;

  const ent=sec.querySelector('.ent.is-hover');
  const card=sec.querySelector('.glimpse:not(.static)');
  if(ent&&card){
    const er=ent.getBoundingClientRect();
    const cw=380, ch=card.offsetHeight||500;
    let left=sx(er.left)-14, top=sy(er.bottom)+12;         // 默认出现在该行下方
    if(top+ch>900-16){ top=sy(er.top)-12-ch; }             // 下方放不下 → 翻到上方
    left=Math.max(16,Math.min(left,1440-cw-16));
    top=Math.max(52,Math.min(top,900-ch-16));
    card.style.left=left+'px'; card.style.top=top+'px';
  }
  const sel=sec.querySelector('.sel');
  const tip=sec.querySelector('.seltool');
  if(sel&&tip){
    const sr=sel.getBoundingClientRect();
    const tw=tip.offsetWidth||150;
    let left=sx(sr.left), top=sy(sr.top)-12-(tip.offsetHeight||32);
    left=Math.max(16,Math.min(left,1440-tw-16));
    if(top<48) top=sy(sr.bottom)+10;
    tip.style.left=left+'px'; tip.style.top=top+'px';
  }
}
function fit(){
  const avail=document.getElementById('viewport').clientWidth-48;
  scale=Math.min(1,avail/1440);
  stage.style.transform=`scale(${scale})`;
  document.querySelector('.viewport').style.height=(900*scale+80)+'px';
  const active=stage.querySelector('.screen.active'); if(active)layoutScreen(active.dataset.screen);
}
let rt; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(fit,80)});

/* 设置页分组切换 */
stage.addEventListener('click',e=>{
  const sideBtn=e.target.closest('.pref-side button');
  if(sideBtn){
    const pane=sideBtn.dataset.pane;
    sideBtn.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===sideBtn));
    stage.querySelectorAll('.pref-main > div').forEach(d=>d.hidden=d.dataset.pane!==pane);
  }
  const segBtn=e.target.closest('.seg button');
  if(segBtn){ segBtn.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===segBtn)); }
  const cbx=e.target.closest('.cbx');
  if(cbx){ cbx.setAttribute('aria-checked', cbx.getAttribute('aria-checked')==='true'?'false':'true'); }
  const sw=e.target.closest('.switch');
  if(sw){ sw.setAttribute('aria-checked', sw.getAttribute('aria-checked')==='true'?'false':'true'); }
});

let saved='reader-day';
try{saved=localStorage.getItem('vivid.screen')||'reader-day'}catch(e){}
show(SCREENS.find(s=>s.id===saved)?saved:'reader-day');
fit();
</script>
